# Пример сценария ПМИ для обвязки (DESIGN, раздел 14.3; 06_PMI, раздел 5.6, PMI-28).
id = "PMI-28"
title = "Потеря связи с ПЧ ведущего насоса"
time_scale = 20.0
timeout_s = 300
backends = ["opcua", "cds"]
manual = []

[setup]
method = "LevelPid"
inflow_m3h = 100.0
run_hours_s = [360000, 720000, 1080000]   # ведущий Н1

[[step]]
note = "работает только Н1 под ПИД"
wait = "GVL_Station.stStationSts.eControlAct = E_ControlAct.LevelPid"
timeout_s = 600

[[step]]
note = "Н1 в работе"
wait = "GVL_Devices.fbP101.stSts.eState = E_MotorState.Running"

[[step]]
note = "потеря связи с ПЧ Н1"
write = { "GVL_Sim.stFaultInj.axVfdCommLoss[1]" = true }
mark = "t_loss"

[[step]]
note = "P101.COM через 3 с, насос не останавливается"
wait_alarm = { code = "P101.COM", state = "ActiveUnack" }
timeout_s = 30
expect = [
  "GVL_Devices.fbP101.stSts.eState = E_MotorState.Running",
  "GVL_Devices.fbP101.stSts.stCommon.wFault = 0",
]
expect_delay = { from = "t_loss", alarm = "P101.COM", state = "ActiveUnack", min_s = 3.0, max_s = 3.5 }

[[step]]
note = "через 5 с ПЧ на 50 Гц (сторожевой таймер), ступенчатое управление"
hold_s = 6
wait_alarm = { code = "KNS1.STEP", state = "ActiveUnack" }
timeout_s = 30
expect = [
  "GVL_Sim.stSimSts.arFreq_Hz[1] >= 49.9",
  "GVL_Station.stStationSts.eControlAct = E_ControlAct.Stepped",
]

[[step]]
note = "без связи 3 мин"
hold_s = 180

[[step]]
note = "связь восстановлена: через 30 с снова ПИД без рывка"
write = { "GVL_Sim.stFaultInj.axVfdCommLoss[1]" = false }
wait = "GVL_Station.stStationSts.eControlAct = E_ControlAct.LevelPid"
timeout_s = 60
wait_alarm = { code = "KNS1.STEP", state = "RtnUnack" }

[teardown]
clear_faults = true
