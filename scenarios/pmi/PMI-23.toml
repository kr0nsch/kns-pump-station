# PMI-23. Залипание поплавка LS102 в сработавшем состоянии (06_PMI, раздел 5.6.4; приложение А: k = 20, 5 мин
# контура).
#
# Ложный LS102 при 1,5 м включает аварийный режим (все доступные насосы, пуски через tStagger = 5 с — по разности
# udiRunCurrent_s, см. PMI-21); через tLdev = 30 с при уровне < 3,50 м поплавок исключается: KNS1.LDEV, бит 9,
# выход из аварийного режима, число насосов — по ступенчатому автомату (вход без рывка: не больше двух).
id = "PMI-23"
title = "Залипание поплавка LS102 в сработавшем состоянии"
time_scale = 20.0
timeout_s = 300
backends = ["opcua", "cds"]
mode = "auto"
manual = []

[setup]
method = "Stepped"
level_m = 1.5
inflow_m3h = 100.0

[[step]]
note = "шаг 1: LS102 залип в сработавшем состоянии"
write = { "GVL_Sim.stFaultInj.eLs102Stuck" = "E_SimFloatStuck.StuckTripped" }
mark = "t1"

[[step]]
note = "через 2 с LS102.ALM, KNS1.EHL, аварийный режим"
wait_alarm = [
  { code = "LS102.ALM", state = "ActiveUnack" },
  { code = "KNS1.EHL", state = "ActiveUnack" },
]
timeout_s = 10
expect_delay = [
  { since = "t1", from_event = "KNS1.E21", alarm = "LS102.ALM", state = "ActiveUnack", min_s = 1.6, max_s = 2.8 },
  { since = "t1", from_alarm = "LS102.ALM", state = "ActiveUnack", alarm = "KNS1.EHL", min_s = 0.0, max_s = 0.8 },
]
expect = ["GVL_Station.stStationSts.eControlAct = E_ControlAct.Emergency"]

[[step]]
note = "пуск всех доступных насосов"
wait = "GVL_Station.stStationSts.uiPumpsRunning = 3"
timeout_s = 30

[[step]]
note = "интервал пусков 5 с: Н1, Н2, Н3"
capture = { c1 = "GVL_Devices.fbP101.stSts.udiRunCurrent_s", c2 = "GVL_Devices.fbP102.stSts.udiRunCurrent_s", c3 = "GVL_Devices.fbP103.stSts.udiRunCurrent_s" }
expect = [
  "{c1 - c2} >= 4",
  "{c1 - c2} <= 6",
  "{c2 - c3} >= 4",
  "{c2 - c3} <= 6",
]

[[step]]
note = "через 30 с (уровень < 3,50 м): KNS1.LDEV, LS102 исключён (бит 9), выход из аварийного режима"
wait_alarm = { code = "KNS1.LDEV", state = "ActiveUnack" }
timeout_s = 60
expect_delay = { since = "t1", from_alarm = "LS102.ALM", state = "ActiveUnack", alarm = "KNS1.LDEV", min_s = 29.6, max_s = 30.8 }
expect = [
  "GVL_Station.stStationSts.wState & 16#0200",          # STN_ST_LS102_MASKED
  "GVL_Station.stStationSts.rLevel_m < 3.50",
]

[[step]]
note = "выход из аварийного режима; число насосов — по ступенчатому алгоритму"
wait = "GVL_Station.stStationSts.eControlAct = E_ControlAct.Stepped"
timeout_s = 10
expect = ["GVL_Station.stStationSts.uiPumpsRequired <= 2"]

[[step]]
note = "лишние насосы остановлены по ступенчатому алгоритму"
wait = "GVL_Station.stStationSts.uiPumpsRunning <= 2"
timeout_s = 60

[[step]]
note = "LS102.ALM остаётся активной до снятия инъекции"
hold_s = 30
expect_alarm = { code = "LS102.ALM", state = "ActiveUnack" }

[[step]]
note = "снять инъекцию — LS102.ALM → RtnUnack"
write = { "GVL_Sim.stFaultInj.eLs102Stuck" = "E_SimFloatStuck.None" }
wait_alarm = { code = "LS102.ALM", state = "RtnUnack" }
timeout_s = 30

[teardown]
clear_faults = true
