# PMI-13. АВР: авария ПЧ работающего насоса, сброс (06_PMI, раздел 5.6.3; приложение А: k = 20, 10 мин контура).
#
# Момент инъекции в журнале — событие 101021 (модель применила изменение stFaultInj, станция записала его в
# следующем цикле): задержки после инъекции меряются от него, без допуска опроса. Импульс сброса ПЧ длится 1 с
# контура — при k = 20 это 50 мс, опрос 0,25 с его не увидит; шаг 3 — при k = 1.
id = "PMI-13"
title = "АВР: авария ПЧ работающего насоса, сброс"
time_scale = 20.0
timeout_s = 300
backends = ["opcua", "cds"]
mode = "auto"
manual = []

[setup]
method = "Stepped"
level_m = 1.7
inflow_m3h = 100.0
run_hours_s = [360000, 180000, 1080000]   # шаг 1: наработка Н2 — 50 ч, ведущий Н2

[[step]]
note = "шаг 1: работает ведущий Н2"
wait = "GVL_Devices.fbP102.stSts.eState = E_MotorState.Running"
timeout_s = 60
expect = ["GVL_Station.stStationSts.aeRole[2] = E_PumpRole.Lead"]

[[step]]
note = "шаг 2: авария ПЧ Н2"
write = { "GVL_Sim.stFaultInj.axVfdFault[2]" = true }
mark = "t_fault"

[[step]]
note = "шаг 2: через 0,2 с P102.EXT, Н2 в отказе, код аварии ПЧ 11"
wait_alarm = { code = "P102.EXT", state = "ActiveUnack" }
timeout_s = 10
expect_delay = { since = "t_fault", from_event = "KNS1.E21", alarm = "P102.EXT", state = "ActiveUnack", min_s = 0.0, max_s = 1.0 }
expect = [
  "GVL_Devices.fbP102.stSts.eState = E_MotorState.Fault",
  "GVL_Devices.fbP102.stSts.stCommon.wFault & 16#0010",  # MOT_FLT_EXT_FAULT
  "GVL_IO.uiP102_FCODE = 11",                             # SIM_VFD_FCODE_EXT — на фейсплейте
]

[[step]]
note = "шаг 2: запрос резервного в том же цикле станции, KNS1.ATS; резервный (Н1, 100 ч) в работе"
wait_alarm = { code = "KNS1.ATS", state = "ActiveUnack" }
timeout_s = 10
expect_event = { event = "KNS1.E6", value = 1, since = "t_fault" }
expect_delay = { since = "t_fault", from_alarm = "P102.EXT", state = "ActiveUnack", event = "KNS1.E6", min_s = 0.0, max_s = 0.8 }

[[step]]
note = "шаг 2: резервный в работе"
wait = "GVL_Devices.fbP101.stSts.eState = E_MotorState.Running"
timeout_s = 15
expect = ["GVL_Station.stStationSts.aeRole[1] = E_PumpRole.Lead"]

[[step]]
note = "шаг 3: «Сброс» Н2 при действующей инъекции — импульс сброса ПЧ (бит 2 слова управления)"
time_scale = 1.0
pulse = "GVL_Hmi.stP102Cmd.stCommon.xReset"
wait = "GVL_IO.wP102_CTW & 16#0004"                      # VFD_CTW_RESET
timeout_s = 1

[[step]]
note = "шаг 3: импульс сброса ≈ 1 с (tResetPulse)"
mark = "t_rst_on"
wait = "GVL_IO.wP102_CTW !& 16#0004"
timeout_s = 3

[[step]]
note = "шаг 3: длительность импульса"
mark = "t_rst_off"
expect = [
  "{t_rst_off - t_rst_on} >= 0.4",
  "{t_rst_off - t_rst_on} <= 1.4",
]

[[step]]
note = "шаг 3: через 3 с (tResetWindow) — RejectedFault, отказ остаётся"
hold_s = 2.5
expect = [
  "GVL_Devices.fbP102.stSts.stCommon.eCmdResult = E_CmdResult.RejectedFault",
  "GVL_Devices.fbP102.stSts.eState = E_MotorState.Fault",
]

[[step]]
note = "шаг 4: снять инъекцию, «Сброс»"
time_scale = 20.0
write = { "GVL_Sim.stFaultInj.axVfdFault[2]" = false }
pulse = "GVL_Hmi.stP102Cmd.stCommon.xReset"
wait = "GVL_Devices.fbP102.stSts.eState <> E_MotorState.Fault"
timeout_s = 10
expect = ["GVL_Devices.fbP102.stSts.stCommon.wFault = 0"]

[[step]]
note = "шаг 4: отказ снят, Н2 — резервный, KNS1.ATS → RtnUnack"
wait = "GVL_Station.stStationSts.aeRole[2] = E_PumpRole.Standby"
timeout_s = 15
wait_alarm = { code = "KNS1.ATS", state = "RtnUnack" }

[teardown]
clear_faults = true
