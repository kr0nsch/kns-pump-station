# PMI-06. ПИД: останов при малом притоке и повторный пуск (06_PMI, раздел 5.6.1; приложение А: k = 20,
# 40 мин контура).
#
# Приток 30 м³/ч меньше подачи насоса на минимальной частоте (≈ 41 м³/ч при 60 %): уровень медленно снижается до
# 1,00 м (≈ 33 мин контура от задания 1,40 м), останов, наполнение до 1,60 м (≈ 14 мин). Выдержка останова 5 с —
# при k = 1 (интервал между наблюдениями — с допуском ≈ ±0,4 с, см. PMI-02).
id = "PMI-06"
title = "ПИД: останов при малом притоке и повторный пуск"
time_scale = 20.0
timeout_s = 300
backends = ["opcua", "cds"]
mode = "auto"
manual = []

[setup]
method = "LevelPid"
level_m = 1.6
inflow_m3h = 30.0

[[step]]
note = "ведущий Н1 в работе под ПИД"
wait = "GVL_Devices.fbP101.stSts.eState = E_MotorState.Running"
timeout_s = 60
expect = ["GVL_Station.stStationSts.aeRole[1] = E_PumpRole.Lead"]

[[step]]
note = "LIC101 управляет (слежение снято)"
wait = "GVL_Station.fbLIC101.xTrack = FALSE"
timeout_s = 30

[[step]]
note = "ведущий уходит на минимальную частоту 60 %, выход ПИД не ниже ≈ 60 % (обратный расчёт)"
wait = "GVL_Devices.fbP101.stSts.rSpeedRef_pct <= 60.01"
timeout_s = 1800
during = ["GVL_Station.fbLIC101.stSts.rOut_pct >= 58.0"]

[[step]]
note = "на минимальной частоте уровень снижается к 1,00 м; выход ПИД держится у 60 %"
wait = "GVL_Station.stStationSts.rLevel_m <= 1.01"
timeout_s = 3000
during = [
  "GVL_Devices.fbP101.stSts.rSpeedRef_pct >= 59.9",
  "GVL_Devices.fbP101.stSts.rSpeedRef_pct <= 60.1",
  "GVL_Station.fbLIC101.stSts.rOut_pct >= 58.0",
  "GVL_Station.stStationSts.eControlAct = E_ControlAct.LevelPid",
]

[[step]]
note = "к уровню останова — без ускорения"
time_scale = 1.0
wait = "GVL_Station.stStationSts.rLevel_m <= 1.00"
timeout_s = 120
during = ["GVL_Devices.fbP101.stSts.eState = E_MotorState.Running"]

[[step]]
note = "уровень ≤ 1,00 м: ждать снятия запроса"
mark = "t_low"
wait = "GVL_Station.axPumpRun[1] = FALSE"
timeout_s = 15

[[step]]
note = "через 5 с останов"
mark = "t_off"
expect = [
  "{t_off - t_low} >= 4.6",
  "{t_off - t_low} <= 5.4",
]

[[step]]
note = "Н1 остановлен, ПИД в слежении"
time_scale = 20.0
wait = "GVL_Devices.fbP101.stSts.eState = E_MotorState.Stopped"
timeout_s = 60
expect = ["GVL_Station.fbLIC101.xTrack = TRUE"]

[[step]]
note = "наработка перед повторным пуском: у Н1 наименьшая"
capture = { h1 = "GVL_Persist.stP101Retain.udiOpTime_s", h2 = "GVL_Persist.stP102Retain.udiOpTime_s", h3 = "GVL_Persist.stP103Retain.udiOpTime_s" }
expect = [
  "{h1} < {h2}",
  "{h1} < {h3}",
]

[[step]]
note = "новый пуск при 1,60 м — ведущим насос с меньшей наработкой (Н1)"
mark = "t_refill"
wait = "GVL_Station.stStationSts.aeRole[1] = E_PumpRole.Lead"
timeout_s = 1500
expect_event = { event = "KNS1.E5", value = 1, since = "t_refill" }
expect = ["GVL_Station.stStationSts.rLevel_m >= 1.55"]

[teardown]
clear_faults = true
