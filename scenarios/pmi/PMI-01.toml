  "GVL_Station.stStationSts.eMode = E_StationMode.Auto",
  "GVL_Station.stStationSts.uiPumpsAvailable = 3",
  "GVL_Station.stStationSts.aeRole[1] = E_PumpRole.Standby",
  "GVL_Station.stStationSts.aeRole[2] = E_PumpRole.Standby",
  "GVL_Station.stStationSts.aeRole[3] = E_PumpRole.Standby",
