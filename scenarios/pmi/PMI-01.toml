# PMI-01. Старт приложения имитации, исходное состояние, безопасный старт (06_PMI, раздел 5.6.1;
# приложение А: k = 1, 2 мин контура, авто + ручн.).
#
# Шаг 1 06 (перезапуск рантайма, загрузка сборки имитации, «Старт») выполняет исполнитель серии
# `cds.py scenarios` до первого сценария: PMI-01 идёт первым, И0 перед ним не выполняется, курсор журнала
# читает кольцо с самой старой записи — события старта приложения записаны до сценария. Затем — И0 (шаг 2 06).
# Допуски задержек между записями журнала: −1/+2 цикла MainTask при k (06 §5.3; +1 — станция видит выходы
# устройств прошлого цикла). «Активна только KNS1.SIM» — по словам wAlmActive (06 §5.5): при стоящих насосах
# уставки PT201 и FT202 подавлены по условию (SuppressedByDesign) и тоже есть в списке GVL_Log.stAlarmView.
id = "PMI-01"
title = "Старт приложения имитации, исходное состояние, безопасный старт"
time_scale = 1.0
timeout_s = 60
backends = ["opcua", "cds"]
mode = "auto+manual"
manual = [
  "шаг 1: перезапуск рантайма, загрузка сборки имитации и «Старт» — исполнитель серии cds.py scenarios перед PMI-01",
  "шаг 1: при первой загрузке (пустой retain) — «Ручной» и KNS1.NOAUTO через 600 с; в серии retain заполнен, задержку NOAUTO вживую проверяет PMI-30",
  "шаг 2: экран «Обзор» — уровень 1,20 м, три стоящих насоса, цвет только у индикатора KNS1.SIM",
]

[setup]
skip_initial_state = true          # состояние сразу после старта приложения
journal_from_start = true          # событие 101015 записано до сценария

[[step]]
note = "шаг 1: имитация включена, KNS1.SIM не квитирована, бит 11 состояния станции"
wait_alarm = { code = "KNS1.SIM", state = "ActiveUnack" }
timeout_s = 5
expect = [
  "GVL_Sim.xSimulation = TRUE",
  "GVL_Station.stStationSts.wState & 16#0800",          # STN_ST_SIMULATION
]
expect_event = { event = "KNS1.E15" }                    # старт приложения ПЛК

[[step]]
note = "шаг 1: режим и способ — из GVL_Persist.stStationRetain"
capture = { mode = "GVL_Persist.stStationRetain.eMode", method = "GVL_Persist.stStationRetain.eMethod" }
expect = [
  "GVL_Station.stStationSts.eMode = {mode}",
  "GVL_Station.stStationSts.eMethod = {method}",
  "GVL_Station.stCfgLkg.astAlarm[9].tOnDelay = T#10M",  # KNS1.NOAUTO — через 600 с «Ручного»
]

[[step]]
note = "шаг 1: насосы не пускаются раньше tPlcStart = 10 с — последовательный пуск начат при старте и разрешён через 10 с"
timeout_s = 30
expect_delay = [
  { from_event = "KNS1.E15", event = "KNS1.E9", min_s = 0.0, max_s = 0.04 },
  { from_event = "KNS1.E15", event = "KNS1.E10", min_s = 9.98, max_s = 10.04 },
]
expect = ["GVL_Station.stCfgLkg.tPlcStart = T#10S"]

[[step]]
note = "шаг 2: исходное состояние И0 (06 §5.2)"
init = { inflow_m3h = 100.0 }

[[step]]
note = "шаг 2: все устройства в норме NE 107, отказов нет"
