# PMI-26. Сигнал LT101 вне диапазона без отказа, противоречие с поплавком (06_PMI, раздел 5.6.5; приложение А:
# k = 20, 5 мин контура).
#
# Ток 3,7 мА — защитная полоса NE 43 (UnderRange). Значение до LL идёт через фильтр LT101 (tFilter 2 с, пересечение
# 0,50 м ≈ через 2 с, 0,20 м ≈ через 3,4 с после инъекции), поэтому задержки от события 101021 включают фильтр.
# Ожидания — по тексту 06. По контракту plc-process-lib 1.0.0 (решение AI-13 аналогового входа) подтверждённый
# выход за диапазон даёт xValid = FALSE: тогда станция сразу переходит на поплавки, LL уровнемера в защиту не идёт
# и противоречия не считаются — проверки, расходящиеся с AI-13, неаварийные (expect, expect_delay), чтобы отчёт
# показал их все.
id = "PMI-26"
title = "Сигнал LT101 вне диапазона без отказа, противоречие с поплавком"
time_scale = 20.0
timeout_s = 120
backends = ["opcua", "cds"]
mode = "auto"
manual = []

[setup]
method = "Stepped"
level_m = 1.5
inflow_m3h = 100.0

[[step]]
note = "шаг 1: LT101 — 3,7 мА (UnderRange, по пересчёту −0,09 м)"
write = { "GVL_Sim.stFaultInj.aeAiFault[1]" = "E_SimAiFault.UnderRange" }
mark = "t1"

[[step]]
note = "через 2 с LT101.OOR (Low), NE 107 «вне спецификации», xValid = TRUE"
wait_alarm = { code = "LT101.OOR", state = "ActiveUnack" }
timeout_s = 10
expect_delay = { since = "t1", from_event = "KNS1.E21", alarm = "LT101.OOR", state = "ActiveUnack", min_s = 1.6, max_s = 2.8 }
expect = [
  "GVL_Devices.fbLT101.stSts.stCommon.eNe107 = E_Ne107Status.OutOfSpecification",
  "GVL_Devices.fbLT101.xValid = TRUE",
]

[[step]]
note = "через 3 с LT101.LL и KNS1.DRY, насосы остановлены"
timeout_s = 30
expect_delay = [
  { since = "t1", from_event = "KNS1.E21", alarm = "LT101.LL", state = "ActiveUnack", min_s = 3.0, max_s = 6.3 },
  { since = "t1", from_alarm = "LT101.LL", state = "ActiveUnack", alarm = "KNS1.DRY", min_s = 0.0, max_s = 0.8 },
]
expect = [
  "GVL_Station.stStationSts.uiPumpsRunning = 0",
  "GVL_Devices.fbP101.stSts.wInterlock & 16#0001",
  "GVL_Devices.fbP102.stSts.wInterlock & 16#0001",
  "GVL_Devices.fbP103.stSts.wInterlock & 16#0001",
]

[[step]]
note = "LS103 не сработал при показании < 0,20 м и статусе S: через 30 с KNS1.LDEV, LT101 исключён (бит 15), KNS1.FLOAT"
timeout_s = 60
expect_delay = { since = "t1", from_event = "KNS1.E21", alarm = "KNS1.LDEV", state = "ActiveUnack", min_s = 30.0, max_s = 35.0 }
expect = [
  "GVL_Station.stStationSts.wState & 16#8000",          # STN_ST_LT_MASKED
  "GVL_Devices.fbLS103.xValue = FALSE",
]
expect_alarm = { code = "KNS1.FLOAT", state = "ActiveUnack" }

[[step]]
note = "без LS103 блокировка «сухой ход» держится до 60 с (tDryRelease)"
hold_s = 50
during = ["GVL_Devices.fbP101.stSts.wInterlock & 16#0001"]

[[step]]
note = "через 60 с без LS103 блокировка «сухой ход» снята"
hold_s = 20
expect = [
  "GVL_Devices.fbP101.stSts.wInterlock !& 16#0001",
  "GVL_Devices.fbP102.stSts.wInterlock !& 16#0001",
  "GVL_Devices.fbP103.stSts.wInterlock !& 16#0001",
  "GVL_Station.stStationSts.eControlAct = E_ControlAct.Float",
]

[teardown]
clear_faults = true
