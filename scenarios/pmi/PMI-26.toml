# PMI-26. Сигнал LT101 вне диапазона без отказа, противоречие с поплавком (06_PMI, раздел 5.6.5; приложение А:
# k = 20, 5 мин контура).
#
# Ток 3,7 мА — защитная полоса NE 43 (UnderRange). По 06 v0.4 и контракту plc-process-lib 1.0.0 (решение AI-13
# аналогового входа): подтверждённый (tFailDelay) выход за диапазон — значение насыщения (3,8 мА, −0,06 м), NE 107
# «вне спецификации», xValid = FALSE (для управления непригодно), уставки считаются по значению насыщения. Станция
# сразу переходит на поплавки (KNS1.FLOAT, событие 101013): сухой ход по LL уровнемера и противоречия с
# поплавками при негодном уровнемере не считаются (KNS1.DRY и KNS1.LDEV нет, бит 15 wState не ставится), защиту
# от сухого хода держит LS103. Редакция 06 v0.3 ждала xValid = TRUE, LL → DRY и исключение уровнемера через
# 30 с — это расходилось с AI-13 (замечание протокола ПМИ 19.10.2026). Значение до LL идёт через фильтр LT101
# (tFilter 2 с): задержки от события 101021 включают фильтр.
id = "PMI-26"
title = "Сигнал LT101 вне диапазона без отказа, противоречие с поплавком"
time_scale = 20.0
timeout_s = 120
backends = ["opcua", "cds"]
mode = "auto"
manual = []

[setup]
method = "Stepped"
level_m = 1.5
inflow_m3h = 100.0

[[step]]
note = "шаг 1: LT101 — 3,7 мА (UnderRange, по пересчёту −0,09 м)"
write = { "GVL_Sim.stFaultInj.aeAiFault[1]" = "E_SimAiFault.UnderRange" }
mark = "t1"

[[step]]
note = "через 2 с LT101.OOR (Low), NE 107 «вне спецификации», xValid = FALSE (AI-13)"
wait_alarm = { code = "LT101.OOR", state = "ActiveUnack" }
timeout_s = 10
expect_delay = { since = "t1", from_event = "KNS1.E21", alarm = "LT101.OOR", state = "ActiveUnack", min_s = 1.6, max_s = 2.8 }
expect = [
  "GVL_Devices.fbLT101.stSts.stCommon.eNe107 = E_Ne107Status.OutOfSpecification",
  "GVL_Devices.fbLT101.xValid = FALSE",
  "GVL_Devices.fbLT101.stSts.stCommon.wFault = 0",
]

[[step]]
note = "уровнемер негоден — управление по поплавкам, KNS1.FLOAT, событие 101013"
wait_alarm = { code = "KNS1.FLOAT", state = "ActiveUnack" }
timeout_s = 10
expect = ["GVL_Station.stStationSts.eControlAct = E_ControlAct.Float"]
expect_event = { event = "KNS1.E13", since = "t1" }
expect_delay = { since = "t1", from_alarm = "LT101.OOR", state = "ActiveUnack", alarm = "KNS1.FLOAT", min_s = 0.0, max_s = 1.2 }

[[step]]
note = "уставки считаются по значению насыщения: LT101.LL; сухого хода по уровнемеру нет"
wait_alarm = { code = "LT101.LL", state = "ActiveUnack" }
timeout_s = 30
expect_delay = { since = "t1", from_event = "KNS1.E21", alarm = "LT101.LL", state = "ActiveUnack", min_s = 3.0, max_s = 6.3 }
expect = [
  "GVL_Devices.fbLT101.xLL = TRUE",
  "GVL_Station.stStationSts.wState !& 16#0001",          # STN_ST_DRY_RUN — нет
  "GVL_Devices.fbP101.stSts.wInterlock !& 16#0001",
  "GVL_Devices.fbP102.stSts.wInterlock !& 16#0001",
  "GVL_Devices.fbP103.stSts.wInterlock !& 16#0001",
]
expect_absent = { alarm = "KNS1.DRY", since = "t1" }

[[step]]
note = "40 с: противоречие с LS103 не считается (уровнемер негоден) — KNS1.LDEV нет, LT101 не исключён (бит 15)"
hold_s = 40
during = [
  "GVL_Station.stStationSts.eControlAct = E_ControlAct.Float",
  "GVL_Station.stStationSts.wState !& 16#8000",          # STN_ST_LT_MASKED — нет
  "GVL_Devices.fbLS103.xValue = FALSE",
]
expect_absent = [
  { alarm = "KNS1.LDEV", since = "t1" },
  { alarm = "KNS1.DRY", since = "t1" },
]

[teardown]
clear_faults = true
