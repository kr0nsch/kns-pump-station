# Обоснованные находки iec_checker (tools/check/run_iec_checker.py).
# Обоснованная находка попадает в отчёт со статусом allowed и не роняет проверку.
# Подробный разбор каждой записи — docs/STATIC_ANALYSIS.md; при изменении кода держите их согласованными.
#
# Ключи записи [[allow]]:
#   id     — идентификатор правила iec_checker (шаблон fnmatch), например "PLCOPEN-CP3";
#   file   — шаблон fnmatch пути исходника (src/POUs/...) или имени собранного файла (FB_X.st);
#            '*' захватывает и '/';
#   match  — необязательно: регулярное выражение по тексту сообщения;
#   reason — обязательно: почему находка допустима.
# ParserError и LexingError обосновать нельзя: их исправляют в коде или в понижении iec-checker.

[[allow]]
id = "PLCOPEN-CP3"
file = "src/*"
reason = "Переменная без явного начального значения получает значение по умолчанию своего типа (МЭК 61131-3, как в CODESYS); вариант сборки iec-checker убирает неконстантные начальные значения"

[[allow]]
id = "PLCOPEN-CP3"
file = "tests/*"
reason = "Как для src/: значения по умолчанию типов; результаты тестов присваиваются до чтения"

[[allow]]
id = "PLCOPEN-CP9"
file = "src/POUs/FB_Example/*"
reason = "Сложность тела FB_Example по классической метрике — 8; iec_checker 0.4 считает её завышенно (docs/STATIC_ANALYSIS.md)"

[[allow]]
id = "PLCOPEN-CP9"
file = "tests/*"
reason = "Наборы тестов — последовательные вызовы без ветвлений (классическая сложность — 1); завышенный подсчёт iec_checker 0.4, метрика для тестов не показательна"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/FB_Example/FB_Example.impl.st"
reason = "Действия «иначе» нет: в зоне гистерезиса выход сохраняет состояние, без фронта счётчик не меняется"

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/PRG_Main/PRG_Main.impl.st"
reason = "Однократная команда HMI не пришла — делать нечего; пустая ветка ELSE только добавит шум"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/PRG_Main/PRG_Main.decl.st"
match = "STCMD|STSTS"
reason = "Ложное срабатывание iec_checker 0.4: обращения к полям структуры (stCmd.xAck, stSts.xOut) он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/*_Test/*_Test.decl.st"
match = "variable: [A-Z][A-Z0-9]*(_[A-Z0-9]+)+$"
reason = "Артефакт понижения: константы набора (VAR CONSTANT, UPPER_SNAKE_CASE) используются в методах-тестах, которые сборка выносит в отдельные функции"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/FB_Example_Test/*.method.decl.st"
match = "FBDUT"
reason = "Ложное срабатывание iec_checker 0.4: экземпляр ФБ используется вызовом fbDut(...), чтением выходов и вызовом методов — это он не считает использованием (как stCmd/stSts в PRG_Main)"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/PRG_Tests/PRG_Tests.decl.st"
match = "FBF_CLAMPTEST|FBEXAMPLETEST"
reason = "Экземпляры наборов регистрируются в coUnit самим объявлением и используются вызовом AreAllTestsFinished()"

# =====================================================================================================
# Логика станции (src/POUs/Station/) и её тесты (tests/POUs/Station/, tests/POUs/Fakes/) — раздел
# команды «логика станции» (DESIGN.md, 15.1). Разбор — docs/STATIC_ANALYSIS.md, раздел «Логика станции».
# =====================================================================================================

[[allow]]
id = "PLCOPEN-L17"
file = "src/POUs/Station/*"
reason = "IF без ELSE — у условия нет действия «иначе»: бит слова состояния, событие по смене, фиксация, переход автомата только при выполнении условия; пустая ветвь ELSE добавила бы шум (как в plc-process-lib)"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/POUs/Station/*"
reason = "Тесты и их помощники: IF без ELSE — накопление признака (первое неверное сочетание, подменный насос следует запросу только в Auto); действия «иначе» нет"

[[allow]]
id = "PLCOPEN-L17"
file = "tests/POUs/Fakes/*"
reason = "Подменные объекты: кольцо журнала и запрос режима — действия «иначе» нет"

[[allow]]
id = "PLCOPEN-CP9"
file = "src/POUs/Station/*"
match = "Code is too complex"
reason = "Тела ФБ станции — нормативные последовательности шагов DESIGN.md 6.x и 7 с пронумерованными шагами (ядро FB_StationCore — порядок цикла PRG_Station, FB_PumpRotation — снимок, подхват, передача роли, снятие и выдача запросов); деление на методы спрятало бы порядок. iec_checker 0.4 считает каждое логическое выражение и каждую ветвь вложенных циклов, метрика завышена; каждая ветвь покрыта юнит-тестами tests/POUs/Station (docs/STATIC_ANALYSIS.md)"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Station/*"
match = "variable: (AFB|FB|ST)[A-Z0-9]*$"
reason = "Ложное срабатывание iec_checker 0.4: экземпляры ФБ используются вызовом (fbStartLead(...), afbPumpProt[i](...)), методами (fbSysTime.Now(), afbAlarm[i].Ack()) и чтением выходов, структуры (stCfg, stRetain, stOld, stSts) — обращением к полям; это он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "src/POUs/Station/FB_StationCore/FB_StationCore.decl.st"
match = "variable: (UIEXPORTLINES|UDIEXPORTERROR)$"
reason = "Ложное срабатывание iec_checker 0.4: входы — аргументы вложенного вызова (rValue := UINT_TO_REAL(uiExportLines) в вызове LogEvent), такой аргумент он не считает использованием"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/Station/*"
match = "variable: (AFB|FB|ST|U)[A-Z0-9]*$"
reason = "Ложное срабатывание iec_checker 0.4: ФБ под тестом и подменные насосы используются вызовом, чтением выходов и параметрами помощников, структуры и объединения (stSts в SIZEOF, uBits) — обращением к полям"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/Station/*"
match = "variable: UISTEPS$"
reason = "Ложное срабатывание iec_checker 0.4: вход помощника — верхняя граница цикла FOR uiStep := 1 TO uiSteps, такое использование он не учитывает"

[[allow]]
id = "UnusedVariable"
file = "tests/POUs/Fakes/*"
reason = "Подменные объекты: поля читают аксессоры свойств и методы, которые понижение iec-checker выносит в отдельные функции (тело ФБ пустое); параметр uiIndex метода GetAlarm подменного насоса намеренно не используется — тревог у него нет"
